openapi: "3.1.0"
info:
  title: "Payment EPI: the routes that your integration serves"
  version: "1.0.0"
  description: "The ten routes that CommerceOS calls on a payment integration, as the payment EPI (External Partner Interface) specifies them, under the baseUrl of the payment integration record. Bare routes carry no context headers, because they run before any configuration exists. Contextful routes carry the three X-EPI-Context headers, and nothing else identifies the caller: protect the endpoint at the network level. Each operation says when CommerceOS calls it; each schema field says what it means. The calls in the other direction are in commerceos-openapi.yaml. Behavior that a schema cannot state, such as what the cashier sees and the ledger effect of each action, is in reference.md."
tags:
  - name: "Lifecycle"
    description: "Outside a payment: install, configuration, methods, terminals."
  - name: "Payment"
    description: "One payment: the stream, later transactions, cancel."
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: "https://piggy.example.com/piggy"
        description: "The baseUrl of the payment integration record in CommerceOS"
paths:
  "/install":
    post:
      tags:
        - "Lifecycle"
      summary: "Install: receive the OAuth2 client for the calls back to CommerceOS"
      description: "A Heads administrator runs the install action on the payment integration record. Store the body: it is the only credential your integration gets. On any 2xx the integration becomes Active."
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/InstallPayload"
      responses:
        "2XX":
          description: "Accepted. The body is ignored, and an empty body is fine."
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
  "/uninstall":
    post:
      tags:
        - "Lifecycle"
      summary: "Uninstall: the integration becomes Inactive"
      description: "The administrator runs the uninstall action. Forget the stored client. A failure is logged and ignored."
      responses:
        "2XX":
          description: "Accepted. The body is ignored, and an empty body is fine."
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
  "/config-schema":
    get:
      tags:
        - "Lifecycle"
      summary: "The form that an administrator fills in per organization node"
      description: "An administrator opens the configuration form of your integration on an organization node. The back office renders one field per member and stores the values; your integration reads them back through GET /v1/context/config/{configId} on the CommerceOS side. Answer members: {} when you need no configuration."
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ConfigSchema"
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
  "/test":
    post:
      tags:
        - "Lifecycle"
      summary: "Test the configuration of the context"
      description: "The administrator runs the test method on the integration: one call per configured node. Read the configuration behind the context id, check it against your provider, and answer true. A non-2xx or anything else counts as fail for that node."
      parameters:
        - "$ref": "#/components/parameters/ConfigId"
        - "$ref": "#/components/parameters/ConfigHash"
        - "$ref": "#/components/parameters/DebugInfo"
      responses:
        "200":
          description: "The configuration works."
          content:
            "application/json":
              schema:
                type: "boolean"
                const: true
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
  "/methods":
    get:
      tags:
        - "Lifecycle"
      summary: "The payment methods that this configuration offers"
      description: "The administrator runs configure on a configuration. CommerceOS creates one payment method record per item. A method reaches the POS pay screen once it is added to the POS profile."
      parameters:
        - "$ref": "#/components/parameters/ConfigId"
        - "$ref": "#/components/parameters/ConfigHash"
        - "$ref": "#/components/parameters/DebugInfo"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/MethodDto"
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
  "/terminals":
    get:
      tags:
        - "Lifecycle"
      summary: "The terminals that this configuration knows"
      description: "An administrator lists the terminals of a configuration. Answer [] when no method of yours requires a terminal."
      parameters:
        - "$ref": "#/components/parameters/ConfigId"
        - "$ref": "#/components/parameters/ConfigHash"
        - "$ref": "#/components/parameters/DebugInfo"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/TerminalDto"
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
  "/terminals/{terminalId}":
    get:
      tags:
        - "Lifecycle"
      summary: "One terminal"
      description: "CommerceOS creates its own payment terminal record for one of your terminals and reads it first."
      parameters:
        - name: "terminalId"
          in: "path"
          required: true
          schema:
            type: "string"
        - "$ref": "#/components/parameters/ConfigId"
        - "$ref": "#/components/parameters/ConfigHash"
        - "$ref": "#/components/parameters/DebugInfo"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TerminalDto"
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
  "/payments/{paymentKey}":
    put:
      tags:
        - "Payment"
      summary: "Start a payment: a stream of steps"
      description: "The cashier chooses your method on the POS. CommerceOS allocates a payment order, whose key is paymentKey, and calls this route. The response is a Server-Sent-Events stream: per step one line `event: <type>`, one line `data: <JSON>`, a blank line. Step types: Create, Cancellable, Wait, ShowImage, VisitPage, RenderView (intermediate); Complete, Decline, Cancel, Fail (final). A stream holds zero or more intermediate steps and exactly one final step. The `data:` JSON, with the type added, matches the schema Step<Type>, or PaymentStep for any of them. A step with no fields, such as Cancel, can omit the `data:` line. CommerceOS sets no timeout of its own and makes no retry: a dropped stream is a transport error to the cashier, and the next attempt reuses the same paymentKey when no order exists yet, so answer a repeated PUT for a completed key with the same result."
      parameters:
        - name: "paymentKey"
          in: "path"
          required: true
          schema:
            type: "string"
        - "$ref": "#/components/parameters/ConfigId"
        - "$ref": "#/components/parameters/ConfigHash"
        - "$ref": "#/components/parameters/DebugInfo"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PaymentInitDto"
      responses:
        "200":
          description: "One SSE message per step, see the operation description. Each data line, with the event type added as type, is a PaymentStep."
          content:
            "text/event-stream":
              schema:
                "$ref": "#/components/schemas/PaymentStep"
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
  "/payments/{paymentKey}/transactions":
    post:
      tags:
        - "Payment"
      summary: "Capture, release or refund"
      description: "The cashier captures a reservation, releases it, or refunds a completed sale. CommerceOS adds one payment record from the answer. It calls once and does not retry. Make the route idempotent on its request: the same paymentKey, token, actions and amount answer the same transaction. A key whose stream did not end in Complete has no payment: answer 404 with an error body."
      parameters:
        - name: "paymentKey"
          in: "path"
          required: true
          schema:
            type: "string"
        - "$ref": "#/components/parameters/ConfigId"
        - "$ref": "#/components/parameters/ConfigHash"
        - "$ref": "#/components/parameters/DebugInfo"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/TransactionInitDto"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TransactionDto"
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
  "/payments/{cancellationToken}/cancel":
    post:
      tags:
        - "Payment"
      summary: "Cancel a payment that sent a Cancellable step"
      description: "The cashier presses Cancel on the waiting dialog, after your stream sent Cancellable and then Wait. CommerceOS calls once, in parallel with the open stream. Answer 2xx, then end the stream with a Cancel step: the final step closes the payment, not this call. A non-2xx shows 'Cancel failed: <message>' and leaves the stream running."
      parameters:
        - name: "cancellationToken"
          in: "path"
          required: true
          schema:
            type: "string"
        - "$ref": "#/components/parameters/ConfigId"
        - "$ref": "#/components/parameters/ConfigHash"
        - "$ref": "#/components/parameters/DebugInfo"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CancelDto"
      responses:
        "2XX":
          description: "Accepted. The body is ignored, and an empty body is fine."
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
components:
  parameters:
    ConfigId:
      name: "X-EPI-Context-Config-Id"
      in: "header"
      required: true
      schema:
        type: "string"
      description: "The four-character id of the EPI configuration that this call runs under. Look the values up with GET /v1/context/config/{configId} on CommerceOS."
    ConfigHash:
      name: "X-EPI-Context-Config-Hash"
      in: "header"
      required: true
      schema:
        type: "string"
      description: "A hash of the configuration values. A changed configuration has a new hash, so it is your cache key."
    DebugInfo:
      name: "X-EPI-Debug-Info"
      in: "header"
      required: true
      schema:
        type: "string"
      description: "JSON with nodeName, baseUrl and name. Logging only. CommerceOS always sends all three headers; check at least X-EPI-Context-Config-Id."
  schemas:
    DecimalDto:
      type: "string"
      pattern: "^-?\\d+(\\.\\d+)?$"
      description: "A decimal number as a string, for example \"100.00\". Never a JSON number."
    PaymentDirection:
      type: "string"
      enum:
        - "Payment"
        - "Payout"
      description: "Payment: the customer pays. Payout: the customer is paid."
    PaymentDeclineReason:
      type: "string"
      description: "A code that selects the sentence the cashier sees. Translated codes: InsufficientFunds (send two params: the available balance and the requested amount), CardNotActive, CardExpired, CardNotFound, CardCancelled, CardFullyRedeemed, CardBlocked, InvalidPin, InvalidCode, Timeout. Any other code is shown as 'Payment declined: <code>', untranslated, in every language."
    Audience:
      type: "string"
      enum:
        - "merchant"
        - "customer"
        - "all"
      description: "Who sees the step: the merchant (the cashier's screen), the customer (the customer display), or all."
    InstallPayload:
      type: "object"
      properties:
        cosBaseUrl:
          type: "string"
          description: "The public base URL of the CommerceOS instance, without /api. Your calls go to {cosBaseUrl}/api/v1/..."
        tokenUrl:
          type: "string"
          description: "The client-credentials token endpoint, complete: <OAuth2 public URL>/oauth2/v1/token."
        clientId:
          type: "string"
          description: "The OAuth2 client id."
        clientSecret:
          type: "string"
          description: "The OAuth2 client secret. CommerceOS refuses to install an integration whose client has no secret."
        scope:
          type: "string"
          description: "The scopes of that client, space-separated, as CommerceOS holds them. The default client of an integration has: me geo:read orders.sales:write orders.payments:write payment-records:write kv. Send the string as scope in the token request. Your integration needs me, kv and orders.payments:write."
      required:
        - "cosBaseUrl"
        - "tokenUrl"
        - "clientId"
        - "clientSecret"
        - "scope"
      description: "The body of POST /install. It is the only credential that your integration receives: the OAuth2 client of the integration's user in CommerceOS, for the calls back to CommerceOS (see the CommerceOS-side document). A second install sends the same client again."
    MethodDto:
      type: "object"
      properties:
        methodId:
          type: "string"
          description: "Your id of the method, unique within the integration, for example com.example.piggy. Every payment and transaction names it."
        name:
          type: "string"
          description: "Display name."
        requires:
          type: "object"
          properties:
            terminal:
              type: "boolean"
              description: "true when a payment needs a payment terminal record. PaymentInitDto then carries terminalId, and CommerceOS reads GET /terminals/{terminalId} when an administrator creates the record."
            specification:
              type: "boolean"
              description: "true when PaymentInitDto must carry the itemized specification."
          required:
            - "terminal"
            - "specification"
          description: "What a payment with this method needs from CommerceOS."
        supports:
          type: "object"
          properties:
            incoming:
              type: "boolean"
              description: "Payments (direction Payment)."
            outgoing:
              type: "boolean"
              description: "Payouts (direction Payout)."
            reversal:
              type: "boolean"
              description: "Annul and Credit through POST /payments/{paymentKey}/transactions."
          required:
            - "incoming"
            - "outgoing"
            - "reversal"
          description: "Which directions and reversals your provider handles."
        allows:
          type: "object"
          properties:
            availableInPos:
              type: "boolean"
              description: "Default true. false hides the method from the pay screen."
            openCashBoxOnUse:
              type: "boolean"
              description: "Default false. Open the cash drawer when the method is used."
            openCashBoxOnReturn:
              type: "boolean"
              description: "Default false. Open the cash drawer on a return paid with the method."
            fullAmountFinishesReceipt:
              type: "boolean"
              description: "Default false. When the cashier tenders more than the balance with this method, the POS pays the change back through a second call to your integration: a Payout on the same method. Set it only when supports.outgoing is true, for example for cash-like methods."
          description: "POS behavior switches. Every field defaults as stated when absent, and configure applies the defaults on every run: an omitted block resets an administrator's edit of these four fields."
      required:
        - "methodId"
        - "name"
        - "requires"
        - "supports"
      description: "One way to pay that your integration offers. CommerceOS creates one payment method record per item of GET /methods when an administrator runs configure, and every configure overwrites name, requires, supports and allows from this DTO. The POS shows it as a button once it is added to the POS profile. The administrator sets the rest of the method in the back office, outside your control: requires customer, requires credit approval, and the currency rules (rounding increment, maximum overpayment). See the reference, section 2, The payment method record."
    TerminalDto:
      type: "object"
      properties:
        terminalId:
          type: "string"
          description: "Your id of the terminal, unique within the method."
        methodId:
          type: "string"
          description: "The method the terminal serves."
        name:
          type: "string"
          description: "Display name."
        directUrl:
          type: "string"
          description: "How to reach the terminal directly on the store network. CommerceOS sends it back as terminalDirectUrl on payments and cancels."
      required:
        - "terminalId"
        - "methodId"
      description: "A payment terminal as your integration knows it. CommerceOS reads it to create its own payment terminal record, which is then linked to a device and a POS terminal by an administrator."
    LocalProxyDto:
      type: "object"
      properties:
        hostname:
          type: "string"
          description: "Reach the proxy at https://<hostname>/proxy."
        secret:
          type: "string"
          description: "Send it as Proxy-Authorization: Bearer <secret>."
      required:
        - "hostname"
        - "secret"
      description: "A proxy on the store network through which a local terminal is reached."
    PaymentInitDto:
      type: "object"
      properties:
        methodId:
          type: "string"
          description: "One of the ids from your GET /methods."
        amount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "The amount to pay, positive."
        currencyCode:
          type: "string"
          description: "ISO 4217, for example SEK."
        direction:
          "$ref": "#/components/schemas/PaymentDirection"
          description: "Payment or Payout."
        payer:
          "$ref": "#/components/schemas/AgentDto"
          description: "The paying party. For direction Payment this is the customer; for Payout it is the organization node of the call."
        payee:
          "$ref": "#/components/schemas/AgentDto"
          description: "The receiving party. For direction Payment this is the organization node of the call; for Payout it is the customer."
        token:
          type: "string"
          description: "An opaque id of the money this payment is about. Echo it on every transaction you return."
        locale:
          type: "string"
          description: "The cashier's locale, for example sv-SE. Use it for texts that you return."
        specification:
          "$ref": "#/components/schemas/SpecificationDto"
          description: "What the payment is for. The total amounts sum to amount."
        debitSynchronously:
          const: true
          description: "Present and true when a payout must be captured in the same call: answer actions Authorize and Debit instead of Authorize alone."
        redirectUrls:
          type: "object"
          properties:
            completed:
              type: "string"
              description: "After a completed payment."
            failed:
              type: "string"
              description: "After a failed payment."
            cancelled:
              type: "string"
              description: "After a cancelled payment."
          required:
            - "completed"
            - "failed"
            - "cancelled"
          description: "For a web flow: https URLs where the customer lands after the outcome."
        termsUrl:
          type: "string"
          description: "The legal terms of the sale, for a provider that shows them."
        terminalId:
          type: "string"
          description: "The payment terminal of the POS, when the method requires one. One of your GET /terminals ids."
        terminalDirectUrl:
          type: "string"
          description: "The directUrl of that terminal, as your GET /terminals answered it."
        localProxy:
          "$ref": "#/components/schemas/LocalProxyDto"
          description: "The proxy through which a local terminal is reached, when isLocalTerminal is true."
        isLocalTerminal:
          type: "boolean"
          description: "true when the terminal sits on the store network and the call must go through localProxy."
        walletCode:
          type: "string"
          description: "For wallet payments such as gift cards: the code the customer presented."
        walletPin:
          type: "string"
          description: "For wallet payments: the PIN the customer entered."
        cardAcquisitionReference:
          type: "object"
          properties:
            poiTransactionId:
              type: "string"
              description: "The POI transaction id of the earlier tap."
            timestamp:
              type: "string"
              description: "Its timestamp, ISO 8601."
          required:
            - "poiTransactionId"
            - "timestamp"
          description: "Reuse an earlier card tap instead of asking the customer again."
      required:
        - "methodId"
        - "amount"
        - "currencyCode"
        - "direction"
        - "payer"
        - "payee"
        - "token"
        - "locale"
        - "specification"
      description: "The body of PUT /payments/{paymentKey}. The paymentKey in the path is the key of the payment order that CommerceOS allocated before the call, and the key your integration uses to complete the payment asynchronously."
    PaymentDto:
      type: "object"
      properties:
        methodId:
          type: "string"
          description: "Echo of the request."
        amount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Echo of the request."
        currencyCode:
          type: "string"
          description: "Echo of the request."
        processorsId:
          type: "string"
          description: "Your id of the payment session at the provider. CommerceOS requires it to be unique per payment method for all time: a Complete whose processorsId equals that of any earlier payment order of the method fails with 'Payment order <id> already exists', so never restart a counter. A repeated PUT for a paymentKey you already completed must answer the same processorsId and the same transactions: CommerceOS refuses a Complete whose processorsId differs from the order's."
        transactions:
          type: "array"
          items:
            "$ref": "#/components/schemas/TransactionDto"
          description: "The money that moved. CommerceOS creates one payment record per item on Complete. Empty on Create."
        issuedWalletKey:
          type: "string"
          description: "The key of a wallet that this payment issued, for example a new gift card."
      required:
        - "methodId"
        - "amount"
        - "currencyCode"
        - "processorsId"
        - "transactions"
      description: "The result of a payment, carried by the Create and Complete steps."
    TransactionInitDto:
      type: "object"
      properties:
        actions:
          type: "array"
          items:
            type: "string"
            enum:
              - "Authorize"
              - "Annul"
              - "Debit"
              - "Credit"
          description: "One or more of Authorize (reserve), Annul (release a reservation), Debit (capture), Credit (refund). Most transactions carry one."
        token:
          type: "string"
          description: "The token of the payment."
        amount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Always positive, also for a refund."
        currencyCode:
          type: "string"
          description: "The payment currency."
        methodId:
          type: "string"
          description: "The method of the payment."
        specification:
          "$ref": "#/components/schemas/SpecificationDto"
          description: "The items this transaction is about. Their total amounts sum to amount."
        walletCode:
          type: "string"
          description: "As in PaymentInitDto."
        isLocalTerminal:
          type: "boolean"
          description: "As in PaymentInitDto."
        terminalDirectUrl:
          type: "string"
          description: "As in PaymentInitDto."
        localProxy:
          "$ref": "#/components/schemas/LocalProxyDto"
          description: "As in PaymentInitDto."
        reversalArgs:
          "$ref": "#/components/schemas/ReversalDto"
          description: "Present on a refund: the original transaction to reverse."
      required:
        - "actions"
        - "token"
        - "amount"
        - "currencyCode"
        - "methodId"
      description: "The body of POST /payments/{paymentKey}/transactions: a capture (Debit), a release (Annul) or a refund (Credit) on a payment that completed. CommerceOS makes the call once and does not retry."
    TransactionDto:
      type: "object"
      properties:
        actions:
          type: "array"
          items:
            type: "string"
            enum:
              - "Authorize"
              - "Annul"
              - "Debit"
              - "Credit"
          description: "One or more of Authorize (reserve), Annul (release a reservation), Debit (capture), Credit (refund). Most transactions carry one."
        token:
          type: "string"
          description: "The token of the payment."
        amount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Always positive, also for a refund."
        currencyCode:
          type: "string"
          description: "The payment currency."
        methodId:
          type: "string"
          description: "The method of the payment."
        specification:
          "$ref": "#/components/schemas/SpecificationDto"
          description: "The items this transaction is about. Their total amounts sum to amount."
        walletCode:
          type: "string"
          description: "As in PaymentInitDto."
        isLocalTerminal:
          type: "boolean"
          description: "As in PaymentInitDto."
        terminalDirectUrl:
          type: "string"
          description: "As in PaymentInitDto."
        localProxy:
          "$ref": "#/components/schemas/LocalProxyDto"
          description: "As in PaymentInitDto."
        reversalArgs:
          "$ref": "#/components/schemas/ReversalDto"
          description: "Present on a refund: the original transaction to reverse."
        transactionId:
          type: "string"
          description: "Your id of the transaction, unique within the method. CommerceOS ignores a later record with a transactionId it already holds, so a repeated completion is safe."
        timestamp:
          type: "string"
          description: "When it happened, ISO 8601."
        means:
          "$ref": "#/components/schemas/PaymentMeansDto"
          description: "What paid. Set it: the receipt prints it instead of the method name, the back office shows it in the Payment means column, and the sales reports group by it; without it those show the method name, nothing, and --. A card terminal sends Card with scheme and maskedPan. A provider without card data sends Singleton with its brand as id. Wallet is only for a wallet that CommerceOS itself holds the balance of."
        consumerPrintout:
          type: "string"
          description: "Receipt text for the customer copy, from the provider."
        merchantPrintout:
          type: "string"
          description: "Receipt text for the merchant copy, from the provider."
        rawData:
          type: "object"
          description: "Any JSON object. Stored as is, never read by CommerceOS."
      required:
        - "actions"
        - "token"
        - "amount"
        - "currencyCode"
        - "methodId"
        - "transactionId"
        - "timestamp"
      description: "What your provider did: a TransactionInitDto plus your identifiers. Returned by POST /payments/{paymentKey}/transactions and listed in PaymentDto.transactions."
    ReversalDto:
      type: "object"
      properties:
        originalTransactionId:
          type: "string"
          description: "The transactionId of the transaction to reverse."
        originalTimestamp:
          type: "string"
          description: "Its timestamp."
        terminalId:
          type: "string"
          description: "The terminal that made it, when the method requires one."
      description: "Names the transaction that a refund reverses."
    CancelDto:
      type: "object"
      properties:
        terminalId:
          type: "string"
          description: "As in PaymentInitDto."
        terminalDirectUrl:
          type: "string"
          description: "As in PaymentInitDto."
        isLocalTerminal:
          type: "boolean"
          description: "As in PaymentInitDto."
        localProxy:
          "$ref": "#/components/schemas/LocalProxyDto"
          description: "As in PaymentInitDto."
      description: "The body of POST /payments/{cancellationToken}/cancel: the local-terminal context of the payment, so that a provider can route the cancel to the right terminal. All fields are optional and echo PaymentInitDto."
    SpecificationDto:
      type: "array"
      items:
        "$ref": "#/components/schemas/SpecificationItemDto"
      description: "The itemized content of a payment or transaction."
    SpecificationItemDto:
      type: "object"
      properties:
        identifier:
          type: "string"
          description: "The article identifier, for example the GTIN or the internal id."
        description:
          type: "string"
          description: "The article name."
        quantity:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Decimal, in unit."
        unit:
          type: "string"
          description: "For example pcs or kg."
        totalAmount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Decimal: quantity times the unit price, VAT included."
        vatPercentage:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Decimal, for example 25."
        currencyCode:
          type: "string"
          description: "ISO 4217."
      required:
        - "description"
        - "quantity"
        - "unit"
        - "totalAmount"
        - "currencyCode"
      description: "One line of what is paid for."
    PaymentMeansDto:
      oneOf:
        - "$ref": "#/components/schemas/PaymentCardDto"
        - "$ref": "#/components/schemas/SingletonPaymentMeansDto"
        - "$ref": "#/components/schemas/WalletPaymentMeansDto"
      description: "What paid, told apart by type: Card, Singleton or Wallet."
    PaymentCardDto:
      type: "object"
      properties:
        type:
          const: "Card"
          description: "Card."
        scheme:
          type: "string"
          description: "For example Visa or Mastercard."
        issuer:
          type: "string"
          description: "The issuing bank."
        maskedPan:
          type: "string"
          description: "The masked card number, for example ************1234."
        token:
          type: "string"
          description: "The provider's token of the card, for later reuse."
        validFrom:
          type: "string"
          description: "ISO 8601 date."
        validTo:
          type: "string"
          description: "ISO 8601 date."
      required:
        - "type"
      description: "A card payment."
    SingletonPaymentMeansDto:
      type: "object"
      properties:
        type:
          const: "Singleton"
          description: "Singleton."
        id:
          type: "string"
          description: "A stable id of the brand or method, for example Piggy Bank. The same id on every transaction of that brand. CommerceOS shows it as the text, first letter capitalized, so write it as the cashier should read it."
      required:
        - "type"
        - "id"
      description: "A means with no per-customer identity, reusable across transactions: a brand or a method, for example swish, vipps, an invoice, or your provider's name. The right choice for a provider without card data."
    WalletPaymentMeansDto:
      type: "object"
      properties:
        type:
          const: "Wallet"
          description: "Wallet."
        walletId:
          type: "string"
          description: "The id of the wallet at the provider."
        providerId:
          type: "string"
          description: "The provider's id."
        provider:
          type: "string"
          description: "The provider's display name."
        maskedCode:
          type: "string"
          description: "The masked wallet code."
        remainingBalance:
          type: "string"
          description: "Decimal: what is left after this transaction."
        refillable:
          type: "boolean"
          description: "true when the wallet can be topped up."
        validFrom:
          type: "string"
          description: "ISO 8601 date."
        validTo:
          type: "string"
          description: "ISO 8601 date."
      required:
        - "type"
      description: "A wallet such as a gift card or a stored-value account."
    AgentDto:
      oneOf:
        - "$ref": "#/components/schemas/PersonDto"
        - "$ref": "#/components/schemas/OrganizationDto"
      description: "A party of the payment: a PersonDto or an OrganizationDto, told apart by type."
    PersonDto:
      type: "object"
      properties:
        key:
          type: "string"
          description: "The CommerceOS key of the agent."
        fullName:
          type: "string"
          description: "Full name."
        nationalId:
          type: "string"
          description: "National id or organization number."
        email:
          type: "string"
          description: "Some providers need it for a receipt or a wallet."
        landlinePhone:
          type: "string"
          description: "Phone number."
        mobilePhone:
          type: "string"
          description: "Phone number."
        invoiceAddress:
          "$ref": "#/components/schemas/AddressDto"
          description: "Where invoices go."
        deliveryAddress:
          "$ref": "#/components/schemas/AddressDto"
          description: "Where goods go."
        type:
          const: "Person"
          description: "Person."
        givenName:
          type: "string"
          description: "First name."
        familyName:
          type: "string"
          description: "Last name."
        phoneNumber:
          type: "string"
          description: "Phone number, when the split into landline and mobile is unknown."
      required:
        - "key"
        - "type"
      description: "A person."
    OrganizationDto:
      type: "object"
      properties:
        key:
          type: "string"
          description: "The CommerceOS key of the agent."
        fullName:
          type: "string"
          description: "Full name."
        nationalId:
          type: "string"
          description: "National id or organization number."
        email:
          type: "string"
          description: "Some providers need it for a receipt or a wallet."
        landlinePhone:
          type: "string"
          description: "Phone number."
        mobilePhone:
          type: "string"
          description: "Phone number."
        invoiceAddress:
          "$ref": "#/components/schemas/AddressDto"
          description: "Where invoices go."
        deliveryAddress:
          "$ref": "#/components/schemas/AddressDto"
          description: "Where goods go."
        type:
          const: "Organization"
          description: "Organization."
      required:
        - "key"
        - "type"
      description: "An organization, for example the store that receives a payment."
    AddressDto:
      type: "object"
      properties:
        lines:
          type: "array"
          items:
            type: "string"
          description: "Street lines."
        postalCode:
          type: "string"
          description: "Postal code."
        cityName:
          type: "string"
          description: "City."
        regionName:
          type: "string"
          description: "Region or state."
        countryCode:
          type: "string"
          description: "ISO 3166-1 alpha-2."
      description: "A postal address."
    EpiErrorDetail:
      type: "object"
      properties:
        code:
          type: "string"
          description: "A provider-defined code. On a Fail step the POS shows the translation of the code when it has one, else message. Never '<code>: <message>'."
        message:
          type: "string"
          description: "A human-readable description. On a Fail step the cashier sees errors[0].message unless code has a translation."
        params:
          type: "array"
          items:
            type: "string"
          description: "Positional parameters for a translated message."
      required:
        - "message"
      description: "One error."
    ErrorBody:
      type: "object"
      properties:
        errors:
          type: "array"
          items:
            "$ref": "#/components/schemas/EpiErrorDetail"
          description: "At least one error. Only the first is shown to the cashier."
      required:
        - "errors"
      description: "The body of every non-2xx answer from your integration. A non-2xx without this body is shown as 'Request failed: <status>'."
    StepCreate:
      type: "object"
      properties:
        type:
          const: "Create"
          description: "Create."
        result:
          "$ref": "#/components/schemas/PaymentDto"
          description: "The session so far, transactions empty."
      required:
        - "type"
        - "result"
      description: "Intermediate. A session exists at the provider. The payment order now exists in CommerceOS, so a completion from a callback can PATCH it if the stream drops. Send it first when a payment can complete asynchronously."
    StepCancellable:
      type: "object"
      properties:
        type:
          const: "Cancellable"
          description: "Cancellable."
        cancellationToken:
          type: "string"
          description: "The token that names this payment in the cancel call."
      required:
        - "type"
        - "cancellationToken"
      description: "Intermediate. CommerceOS may now call POST /payments/{cancellationToken}/cancel with this token. Follow it with a Wait step: the cancel button sits on the waiting dialog, and Cancellable alone shows the cashier nothing."
    StepWait:
      type: "object"
      properties:
        type:
          const: "Wait"
          description: "Wait."
        message:
          type: "string"
          description: "The text for the cashier."
        element:
          type: "string"
          description: "A POS element to show instead of a plain message."
        translationKey:
          type: "string"
          description: "A POS translation key to show instead of message."
        params:
          type: "array"
          items:
            type: "string"
          description: "Fill {0}, {1} of the message or the translation."
      required:
        - "type"
      description: "Intermediate. Show the cashier a waiting message. Send one at intervals while you wait for the provider: the HTTP runtime closes a stream with no bytes after about five minutes."
    StepShowImage:
      type: "object"
      properties:
        type:
          const: "ShowImage"
          description: "ShowImage."
        url:
          type: "string"
          description: "The image URL."
        audience:
          "$ref": "#/components/schemas/Audience"
          description: "Who sees it. Default: merchant."
      required:
        - "type"
        - "url"
      description: "Intermediate. Show an image, for example a QR code."
    StepVisitPage:
      type: "object"
      properties:
        type:
          const: "VisitPage"
          description: "VisitPage."
        url:
          type: "string"
          description: "The page URL."
        audience:
          "$ref": "#/components/schemas/Audience"
          description: "Who sees it."
      required:
        - "type"
        - "url"
      description: "Intermediate. Open a web page. The manned POS renders nothing for it."
    StepRenderView:
      type: "object"
      properties:
        type:
          const: "RenderView"
          description: "RenderView."
        path:
          type: "string"
          description: "The view path."
        config:
          type: "string"
          description: "Its configuration."
        audience:
          "$ref": "#/components/schemas/Audience"
          description: "Who sees it."
      required:
        - "type"
        - "path"
        - "config"
      description: "Intermediate. Render a CommerceOS view."
    StepComplete:
      type: "object"
      properties:
        type:
          const: "Complete"
          description: "Complete."
        result:
          "$ref": "#/components/schemas/PaymentDto"
          description: "The payment with its transactions."
        issuedWalletKey:
          type: "string"
          description: "The key of a wallet that this payment issued."
      required:
        - "type"
        - "result"
      description: "Final. Success. CommerceOS creates one payment record per result.transactions item and closes the receipt when the amount is covered."
    StepDecline:
      type: "object"
      properties:
        type:
          const: "Decline"
          description: "Decline."
        reason:
          "$ref": "#/components/schemas/PaymentDeclineReason"
          description: "The code that selects the cashier's sentence."
        params:
          type: "array"
          items:
            type: "string"
          description: "Fill {0}, {1} of that sentence. InsufficientFunds needs two."
      required:
        - "type"
        - "reason"
      description: "Final. A normal negative outcome, not an error: no payment record. The sale stays open and the cashier chooses another method."
    StepCancel:
      type: "object"
      properties:
        type:
          const: "Cancel"
          description: "Cancel."
      required:
        - "type"
      description: "Final. The payment was cancelled, after POST /payments/{cancellationToken}/cancel. May be sent without a data line."
    StepFail:
      type: "object"
      properties:
        type:
          const: "Fail"
          description: "Fail."
        errors:
          type: "array"
          items:
            "$ref": "#/components/schemas/EpiErrorDetail"
          description: "At least one error."
      required:
        - "type"
        - "errors"
      description: "Final. An error. The cashier sees 'Payment failed: ' plus errors[0]."
    TerminalPaymentStep:
      oneOf:
        - "$ref": "#/components/schemas/StepComplete"
        - "$ref": "#/components/schemas/StepDecline"
        - "$ref": "#/components/schemas/StepCancel"
        - "$ref": "#/components/schemas/StepFail"
      description: "The final steps. Exactly one ends every stream."
    IntermediatePaymentStep:
      oneOf:
        - "$ref": "#/components/schemas/StepCreate"
        - "$ref": "#/components/schemas/StepCancellable"
        - "$ref": "#/components/schemas/StepWait"
        - "$ref": "#/components/schemas/StepShowImage"
        - "$ref": "#/components/schemas/StepVisitPage"
        - "$ref": "#/components/schemas/StepRenderView"
      description: "The steps that may precede the final step, zero or more."
    PaymentStep:
      oneOf:
        - "$ref": "#/components/schemas/TerminalPaymentStep"
        - "$ref": "#/components/schemas/IntermediatePaymentStep"
      description: "Any step of the payment stream. On the wire each step is one SSE message: a line 'event: <type>', a line 'data: <JSON without type>', a blank line. CommerceOS reads the JSON and adds type from the event line."
    LocalizableString:
      description: "A string, or a map from locale to string, for example {\"en-US\": \"The API key\", \"sv-SE\": \"API-nyckeln\"}. The back office picks the exact locale, then the same language, then en-US, then the first value."
      oneOf:
        - type: "string"
        - type: "object"
          additionalProperties:
            type: "string"
    ConfigTypeString:
      description: "The type of one configuration field, written as in the CommerceOS API's own type declarations. Base types: string, number, boolean, object (give it members), string[], number[], object[]. A union of quoted values: 'TEST' or 'LIVE' (two or more, joined by or). A trailing ? makes the field optional. Nothing else is accepted: no named types, no (read-only), no and."
      type: "string"
      pattern: "^(string|number|boolean|object|string\\[\\]|number\\[\\]|object\\[\\]|'[^']+'( or '[^']+')*)\\??$"
    ConfigMember:
      description: "One configuration field. The back office shows description as the label when present, else title, and title as the placeholder. A field whose type has no trailing ? is required: the form shows 'Required' until it has a value."
      type: "object"
      properties:
        type:
          "$ref": "#/components/schemas/ConfigTypeString"
        title:
          "$ref": "#/components/schemas/LocalizableString"
          description: "The field label, or the placeholder when description is present."
        description:
          "$ref": "#/components/schemas/LocalizableString"
          description: "Help text. When present it is the label the administrator sees."
        members:
          type: "object"
          additionalProperties:
            "$ref": "#/components/schemas/ConfigMember"
          description: "For type object: the nested fields, rendered as a group."
      required:
        - "type"
    ConfigSchema:
      description: "The answer of GET /config-schema: a form description, not a JSON Schema. It has the shape of the CommerceOS API's own type declarations: title, description and members, each member with a type string. The back office renders one field per member when an administrator edits the configuration of your integration on an organization node, and stores the values. Your integration reads them back through GET /v1/context/config/{configId} and validates them in POST /test. members may be empty when the integration needs no configuration."
      type: "object"
      properties:
        title:
          "$ref": "#/components/schemas/LocalizableString"
          description: "The title of the configuration form."
        description:
          "$ref": "#/components/schemas/LocalizableString"
          description: "Help text under the title."
        members:
          type: "object"
          additionalProperties:
            "$ref": "#/components/schemas/ConfigMember"
          description: "The fields, keyed by the property name that the stored configuration object uses."
      required:
        - "members"
