  "/v1/payment-orders/{paymentKey}":
    patch:
      tags:
        - "Payment orders"
      summary: "Add payment records: complete a payment asynchronously"
      description: "Your provider confirms a payment after the stream dropped, for example through a callback. The order exists once your stream sent Create or Complete; for a key that saw neither, the answer is 404 'Payment order not found.'. A record whose transactionId CommerceOS already holds is ignored, so a repeated callback is safe. When the cashier pays again, CommerceOS finds the order Debited for the amount and attaches it without a new call to your integration."
