      tags:
        - "Token"
      summary: "A client-credentials token"
      description: "Before the first call and after expires_in seconds. Send the form with grant_type client_credentials and the client from the install payload."
      servers:
        - url: "{oauth2Origin}"
          variables:
            oauth2Origin:
              default: "https://example.app.heads.com"
              description: "The origin of tokenUrl from the install payload: tokenUrl is this origin plus the path below. Call tokenUrl as the install payload gives it"
      requestBody:
        required: true
        content:
          "application/x-www-form-urlencoded":
            schema:
              "$ref": "#/components/schemas/TokenRequest"
      security: []
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TokenResponse"
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
  "/v1/context/config/{configId}":
