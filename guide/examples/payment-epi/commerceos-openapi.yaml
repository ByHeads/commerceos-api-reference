components:
  securitySchemes:
    oauth2:
      type: "oauth2"
      description: "Client credentials of the OAuth2 client from the install payload. Request the token at tokenUrl."
      flows:
        clientCredentials:
          tokenUrl: "{tokenUrl}"
          scopes:
            me: "Read the configuration behind a context id (and the integration's own user)."
            kv: "Read, write and delete values in the key-value store."
            "orders.payments:write": "Add payment records to a payment order."
            "geo:read": "In the default client. Not needed by these routes."
            "orders.sales:write": "In the default client. Not needed by these routes."
            "payment-records:write": "In the default client. Not needed by these routes."
  schemas:
    DecimalDto:
      type: "string"
      pattern: "^-?\\d+(\\.\\d+)?$"
      description: "A decimal number as a string, for example \"100.00\". Never a JSON number."
    SpecificationDto:
      type: "array"
      items:
        "$ref": "#/components/schemas/SpecificationItemDto"
      description: "The itemized content of a payment or transaction."
    SpecificationItemDto:
      type: "object"
      properties:
        identifier:
          type: "string"
          description: "The article identifier, for example the GTIN or the internal id."
        description:
          type: "string"
          description: "The article name."
        quantity:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Decimal, in unit."
        unit:
          type: "string"
          description: "For example pcs or kg."
        totalAmount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Decimal: quantity times the unit price, VAT included."
        vatPercentage:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Decimal, for example 25."
        currencyCode:
          type: "string"
          description: "ISO 4217."
      required:
        - "description"
        - "quantity"
        - "unit"
        - "totalAmount"
        - "currencyCode"
      description: "One line of what is paid for."
    PaymentMeansDto:
      oneOf:
        - "$ref": "#/components/schemas/PaymentCardDto"
        - "$ref": "#/components/schemas/SingletonPaymentMeansDto"
        - "$ref": "#/components/schemas/WalletPaymentMeansDto"
      description: "What paid, told apart by type: Card, Singleton or Wallet."
    PaymentCardDto:
      type: "object"
      properties:
        type:
          const: "Card"
          description: "Card."
        scheme:
          type: "string"
          description: "For example Visa or Mastercard."
        issuer:
          type: "string"
          description: "The issuing bank."
        maskedPan:
          type: "string"
          description: "The masked card number, for example ************1234."
        token:
          type: "string"
          description: "The provider's token of the card, for later reuse."
        validFrom:
          type: "string"
          description: "ISO 8601 date."
        validTo:
          type: "string"
          description: "ISO 8601 date."
      required:
        - "type"
      description: "A card payment."
    SingletonPaymentMeansDto:
      type: "object"
      properties:
        type:
          const: "Singleton"
          description: "Singleton."
        id:
          type: "string"
          description: "The id of the means."
      required:
        - "type"
        - "id"
      description: "A means with one instance, for example an invoice or a cash payment."
    WalletPaymentMeansDto:
      type: "object"
      properties:
        type:
          const: "Wallet"
          description: "Wallet."
        walletId:
          type: "string"
          description: "The id of the wallet at the provider."
        providerId:
          type: "string"
          description: "The provider's id."
        provider:
          type: "string"
          description: "The provider's display name."
        maskedCode:
          type: "string"
          description: "The masked wallet code."
        remainingBalance:
          type: "string"
          description: "Decimal: what is left after this transaction."
        refillable:
          type: "boolean"
          description: "true when the wallet can be topped up."
        validFrom:
          type: "string"
          description: "ISO 8601 date."
        validTo:
          type: "string"
          description: "ISO 8601 date."
      required:
        - "type"
      description: "A wallet such as a gift card or a stored-value account."
    EpiErrorDetail:
      type: "object"
      properties:
        code:
          type: "string"
          description: "A provider-defined code. On a Fail step the POS shows the translation of the code when it has one, else message. Never '<code>: <message>'."
        message:
          type: "string"
          description: "A human-readable description. On a Fail step the cashier sees errors[0].message unless code has a translation."
        params:
          type: "array"
          items:
            type: "string"
          description: "Positional parameters for a translated message."
      required:
        - "message"
      description: "One error."
    ErrorBody:
      type: "object"
      properties:
        errors:
          type: "array"
          items:
            "$ref": "#/components/schemas/EpiErrorDetail"
          description: "At least one error. Only the first is shown to the cashier."
      required:
        - "errors"
      description: "The body of every non-2xx answer from your integration. A non-2xx without this body is shown as 'Request failed: <status>'."
    TokenRequest:
      description: "The form body of POST {tokenUrl}, application/x-www-form-urlencoded."
      type: "object"
      properties:
        grant_type:
          description: "Always client_credentials."
          const: "client_credentials"
        client_id:
          type: "string"
          description: "clientId from the install payload."
        client_secret:
          type: "string"
          description: "clientSecret from the install payload."
        scope:
          type: "string"
          description: "scope from the install payload, or the subset you need, space-separated."
      required:
        - "grant_type"
        - "client_id"
        - "client_secret"
    TokenResponse:
      description: "A bearer token. Cache it until expires_in seconds have passed, then request a new one."
      type: "object"
      properties:
        access_token:
          type: "string"
          description: "Send it as Authorization: Bearer <access_token>."
        token_type:
          type: "string"
          description: "Bearer."
        expires_in:
          type: "integer"
          description: "Lifetime in seconds, 3600 for the default client."
        scope:
          type: "string"
          description: "The granted scopes, space-separated."
      required:
        - "access_token"
        - "expires_in"
    ContextConfig:
      description: "The configuration behind a context id, as an administrator saved it against your config schema."
      type: "object"
      properties:
        configuration:
          type: "object"
          additionalProperties: true
          description: "The values, keyed as your config schema's members."
        configurationHash:
          type: "string"
          description: "Equals the X-EPI-Context-Config-Hash header of the calls that run under this configuration. Cache by it."
      required:
        - "configuration"
        - "configurationHash"
    PaymentOrderStatus:
      description: "One flag of a payment order's status. The status is a set, recomputed from the records on every read: New (part of the amount is not yet authorized, annulled, debited or credited), Authorized (reserved, not captured), Annulled (a reservation was released), Debited (captured), Credited (refunded)."
      type: "string"
      enum:
        - "New"
        - "Authorized"
        - "Annulled"
        - "Debited"
        - "Credited"
    PaymentOrderRecord:
      description: "One payment record to add to a payment order: the CommerceOS shape of a TransactionDto. CommerceOS rejects a record with a missing required member, ignores a record whose transactionId it already holds (same method), and answers 400 to a Debit or Authorize beyond the remaining amount."
      type: "object"
      properties:
        identifiers:
          type: "object"
          description: "Your transaction id, qualified by the method."
          properties:
            transactionId:
              type: "object"
              properties:
                method:
                  type: "object"
                  properties:
                    identifiers:
                      type: "object"
                      properties:
                        methodId:
                          type: "string"
                          description: "Your methodId."
                      required:
                        - "methodId"
                      description: "The identifiers of the method."
                  required:
                    - "identifiers"
                  description: "The payment method, by its methodId."
                id:
                  type: "string"
                  description: "Your transactionId, unique within the method."
              required:
                - "method"
                - "id"
              description: "Your transaction id, qualified by the method it belongs to."
          required:
            - "transactionId"
        currency:
          type: "object"
          properties:
            identifiers:
              type: "object"
              properties:
                currencyCode:
                  type: "string"
                  description: "ISO 4217."
              required:
                - "currencyCode"
              description: "The identifiers of the currency."
          required:
            - "identifiers"
          description: "The payment currency."
        timestamp:
          type: "string"
          description: "ISO 8601."
        amount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Finite and non-zero."
        actions:
          type: "array"
          items:
            type: "string"
            enum:
              - "Authorize"
              - "Annul"
              - "Debit"
              - "Credit"
          description: "One or more of the four actions."
        token:
          type: "string"
          description: "The token of the payment. Without it CommerceOS takes the available money for the first action."
        specification:
          "$ref": "#/components/schemas/SpecificationDto"
        means:
          "$ref": "#/components/schemas/PaymentMeansDto"
        rawData:
          type: "object"
          description: "Any JSON object."
        consumerPrintout:
          type: "string"
          description: "Receipt text for the customer copy."
        merchantPrintout:
          type: "string"
          description: "Receipt text for the merchant copy."
      required:
        - "identifiers"
        - "currency"
        - "timestamp"
        - "amount"
        - "actions"
    PaymentOrderPatch:
      description: "The body of PATCH /v1/payment-orders/{paymentKey}: the records to add. Use it to complete a payment whose stream dropped before Complete, from a callback of your provider."
      type: "object"
      properties:
        records:
          type: "array"
          items:
            "$ref": "#/components/schemas/PaymentOrderRecord"
          description: "The records to add, one per transaction."
      required:
        - "records"
    PaymentOrder:
      description: "The payment order after the patch. Only the members that a payment integration reads are listed."
      type: "object"
      properties:
        identifiers:
          type: "object"
          properties:
            key:
              type: "string"
              description: "The paymentKey."
          description: "The identifiers of the order."
        status:
          type: "array"
          items:
            "$ref": "#/components/schemas/PaymentOrderStatus"
          description: "The status set. A one-step sale is [\"Debited\"], a refunded sale [\"Credited\",\"Debited\"]."
