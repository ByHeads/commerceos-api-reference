            type: "string"
        - name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      security:
        - oauth2:
            - "kv"
      responses:
        "200":
          description: "The stored JSON value."
          content:
            "application/json":
              schema: {}
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
    put:
      tags:
