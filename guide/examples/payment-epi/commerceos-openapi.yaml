openapi: "3.1.0"
info:
  title: "CommerceOS for payment integrations: the routes that your integration calls"
  version: "1.0.0"
  description: "The four things a payment integration does on CommerceOS, with the OAuth2 client it received in the install payload: get a token, read the configuration behind a context id, keep its own state in its key-value store, and complete a payment asynchronously. Every call carries Authorization: Bearer <token>, content-type application/json and accept application/json. The scopes of the client bound what it can do; a client created in the back office for an integration has me geo:read orders.sales:write orders.payments:write payment-records:write payment-means:read, and the administrator adds {store}:write for the integration's key-value store. These routes need me, orders.payments:write and that store scope. Other resources, such as payment integrations and payment terminals, are not available to the client. The full CommerceOS API is documented at {cosBaseUrl}/api-docs."
tags:
  - name: "Token"
  - name: "Configuration"
  - name: "Key-value store"
    description: "Your integration's own state, under /v1/context/kv/{store}/{key}. The store is created by a Heads administrator; the scope {store}:write is written with the store's name, for example com.example.piggy:write."
  - name: "Payment orders"
servers:
  - url: "{cosBaseUrl}/api"
    variables:
      cosBaseUrl:
        default: "https://example.app.heads.com"
        description: "cosBaseUrl from the install payload"
paths:
  "/oauth2/v1/token":
    post:
      tags:
        - "Token"
      summary: "A client-credentials token"
      description: "Before the first call and after expires_in seconds. Send the form with grant_type client_credentials and the client from the install payload."
      servers:
        - url: "{oauth2Origin}"
          variables:
            oauth2Origin:
              default: "https://example.app.heads.com"
              description: "The origin of tokenUrl from the install payload: tokenUrl is this origin plus the path below. Call tokenUrl as the install payload gives it"
      requestBody:
        required: true
        content:
          "application/x-www-form-urlencoded":
            schema:
              "$ref": "#/components/schemas/TokenRequest"
      security: []
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TokenResponse"
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
  "/v1/context/{configId}":
    get:
      tags:
        - "Configuration"
      summary: "The configuration behind a context id"
      description: "On a contextful call whose X-EPI-Context-Config-Hash you have not seen: read the values an administrator saved against your config schema, in clear, and cache them by configurationHash, which is the header's value. The answer also carries configurationType and the schema as CommerceOS holds it. An id that is not a configuration of your integration answers 200 with the body null, not 404."
      parameters:
        - name: "configId"
          in: "path"
          required: true
          schema:
            type: "string"
      security:
        - oauth2:
            - "me"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ContextConfig"
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
  "/v1/context/kv/{store}/{key}":
    get:
      tags:
        - "Key-value store"
      summary: "Read a value of your store"
      description: "Your own state, for example a provider session behind a paymentKey, so that a restart of your integration loses nothing. store is the name of your key-value store, three dot-separated parts such as com.example.piggy; a Heads administrator creates it and puts {store}:write on your client ({store}:read reads only). A key never written answers 200 with null, not 404; a store your client has no scope for answers 404. A sub-path of a stored document is addressable on its own: /v1/context/kv/{store}/{key}/state. GET /v1/context/kv/{store} answers {} whatever the store holds: no route lists the keys, so keep your own index. Write the key in the path URL-encoded."
      parameters:
        - name: "store"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      security:
        - oauth2:
            - "{store}:write"
      responses:
        "200":
          description: "The stored JSON value."
          content:
            "application/json":
              schema: {}
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
    put:
      tags:
        - "Key-value store"
      summary: "Write a value of your store"
      description: "Any JSON value. The answer echoes it. A write replaces what is at the path, nothing merges: PATCH does the same as PUT. A body of null deletes the key."
      parameters:
        - name: "store"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {}
      security:
        - oauth2:
            - "{store}:write"
      responses:
        "200":
          description: "The stored JSON value."
          content:
            "application/json":
              schema: {}
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
    patch:
      tags:
        - "Key-value store"
      summary: "The same as PUT: a write replaces"
      description: "Identical to PUT. Nothing merges: to change one field, write that field's own sub-path."
      parameters:
        - name: "store"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {}
      security:
        - oauth2:
            - "{store}:write"
      responses:
        "200":
          description: "The stored JSON value."
          content:
            "application/json":
              schema: {}
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
    delete:
      tags:
        - "Key-value store"
      summary: "Delete a value of your store"
      description: "After the payment is settled and you no longer need the state. The answer is 200 with deletedCount, also for a key that was not there."
      parameters:
        - name: "store"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      security:
        - oauth2:
            - "{store}:write"
      responses:
        "200":
          description: "Deleted."
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
  "/v1/payment-orders/{paymentKey}":
    patch:
      tags:
        - "Payment orders"
      summary: "Add payment records: complete a payment asynchronously"
      description: "Your provider confirms a payment after the stream dropped, for example through a callback. The order exists once your stream sent Create or Complete; for a key that saw neither, the answer is 400 with details 'Payment order not found.'. A repeat of the identical record on the same order is a no-op, so a repeated callback with the same body is safe; a record that reuses a transactionId with any field changed is refused. When the cashier pays again, CommerceOS finds the order Debited for the amount and attaches it without a new call to your integration."
      parameters:
        - name: "paymentKey"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PaymentOrderPatch"
      security:
        - oauth2:
            - "orders.payments:write"
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PaymentOrder"
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
components:
  securitySchemes:
    oauth2:
      type: "oauth2"
      description: "Client credentials of the OAuth2 client from the install payload. Request the token at the tokenUrl of the install payload; the URL below is the example instance."
      flows:
        clientCredentials:
          tokenUrl: "https://example.app.heads.com/oauth2/v1/token"
          scopes:
            me: "Read the configuration behind a context id (and the integration's own user)."
            "{store}:write": "Read, write and delete the keys of the key-value store named {store}, for example com.example.piggy:write. Granted by the administrator who created the store; {store}:read reads only."
            "orders.payments:write": "Add payment records to a payment order."
            "geo:read": "In the default client. Not needed by these routes."
            "orders.sales:write": "In the default client. Not needed by these routes."
            "payment-records:write": "In the default client. Not needed by these routes."
            "payment-means:read": "In the default client. Not needed by these routes."
  schemas:
    DecimalDto:
      type: "string"
      pattern: "^(-?\\d+(\\.\\d+)?|Missing)$"
      description: "A decimal number as a string, never a JSON number. CommerceOS sends a whole amount without decimals (\"15\", not \"15.00\") and a fraction without trailing zeros (\"10.04\", but \"298.5\" for 298.50); accept both and compare numerically. In a specification item CommerceOS may send the literal \"Missing\" for a quantity or amount it does not know; do not parse it as a number. Answer in either numeric form."
    LocalizableString:
      description: "A string, or a map from locale to string, for example {\"en-US\": \"The API key\", \"sv-SE\": \"API-nyckeln\"}. The back office picks the exact locale, then any key of the same language, then en-US, then the first value. An empty string counts as missing."
      oneOf:
        - type: "string"
        - type: "object"
          additionalProperties:
            type: "string"
    ConfigTypeString:
      description: "The type of one configuration member, written as in the CommerceOS API's own type declarations: one base and an optional trailing ? for optional. Bases: string, number, boolean; secret (a string that CommerceOS masks for administrators and shows in clear only to your integration); a union of quoted values such as 'TEST' or 'LIVE' (two or more, joined by or only; add or null for an optional one); the name of another type of the schema (a nested group of fields), or that name followed by [] (a list of them); string[] or number[] (a list of scalars); object or object[] (free-form JSON). Nothing else: no (read-only), no and, and no name that is also a type of the CommerceOS API (secret, string, product, ...). A member without ? or or null is required: the form shows Required until it has a value, and the configuration is refused without it."
      type: "string"
      pattern: "^\\S.*$"
    ConfigMember:
      description: "One configuration member. The administrator sees title as the label, else description, else the member name; with both, the description sits behind an info icon beside the label. A member has no nested members: a group is a member typed with another type of the schema."
      type: "object"
      properties:
        type:
          "$ref": "#/components/schemas/ConfigTypeString"
        title:
          "$ref": "#/components/schemas/LocalizableString"
          description: "The label of the field."
        description:
          "$ref": "#/components/schemas/LocalizableString"
          description: "Help text, shown behind an info icon when title is present, else as the label."
        multiline:
          type: "boolean"
          description: "On a string member: edited as a block of text, for a PEM certificate for example. A secret is always a single-line password field."
      required:
        - "type"
    ConfigType:
      description: "One type of the configuration schema: a description and its members. The type named by configurationType is what the administrator's configuration is an instance of; the other types are the groups its members refer to."
      type: "object"
      properties:
        description:
          "$ref": "#/components/schemas/LocalizableString"
          description: "What the type is. Optional: CommerceOS fills in the type name."
        members:
          type: "object"
          additionalProperties:
            "$ref": "#/components/schemas/ConfigMember"
          description: "The members, keyed by the property name that the stored configuration object uses. Empty on the configuration type when your integration needs no configuration."
      required:
        - "members"
    TokenRequest:
      description: "The form body of POST {tokenUrl}, application/x-www-form-urlencoded."
      type: "object"
      properties:
        grant_type:
          description: "Always client_credentials."
          const: "client_credentials"
        client_id:
          type: "string"
          description: "clientId from the install payload."
        client_secret:
          type: "string"
          description: "clientSecret from the install payload."
        scope:
          type: "string"
          description: "scope from the install payload, or the subset you need, space-separated: me, orders.payments:write and the <store>:write scope of your key-value store. A request without scope gets every scope the client holds. A requested scope the client lacks is left out of the token without an error, so read scope in the answer: a missing store scope shows up as 404 on the first state call, not at the token. A scope that does not exist, such as the retired kv, fails the whole request with 400 invalid_scope."
      required:
        - "grant_type"
        - "client_id"
        - "client_secret"
    TokenResponse:
      description: "A bearer token. Cache it until expires_in seconds have passed, then request a new one."
      type: "object"
      properties:
        access_token:
          type: "string"
          description: "Send it as Authorization: Bearer <access_token>."
        token_type:
          type: "string"
          description: "Bearer."
        expires_in:
          type: "integer"
          description: "Lifetime in seconds, about 3600 today (3599 seen). Read it rather than assuming it."
        scope:
          type: "string"
          description: "The granted scopes, space-separated."
      required:
        - "access_token"
        - "expires_in"
    ContextConfig:
      description: "The configuration behind a context id, as an administrator saved it against your config schema, in clear: secret members included. The body is null, with status 200, for an id that is not a configuration of your integration."
      type: "object"
      properties:
        "@type":
          type: "string"
          description: "EPI configuration assignment."
        configuration:
          type: "object"
          additionalProperties: true
          description: "The values, keyed as the members of your configuration type. Absent when the administrator has saved nothing yet."
        configurationHash:
          type: "string"
          description: "A SHA-256 of the stored values, URL-safe base64, 43 characters. It equals the X-EPI-Context-Config-Hash header of every call that runs under this configuration, and it changes with any value, secrets included. Cache by it."
        configurationType:
          type: "string"
          description: "The name of the type that configuration is an instance of, as your config schema declared it."
        schema:
          type: "object"
          additionalProperties:
            "$ref": "#/components/schemas/ConfigType"
          description: "The types of your config schema as CommerceOS holds them, with a member added to the configuration type for every stored value your declaration leaves out (inferred as string?, number?, boolean?, string[]? or secret? when the name looks like a secret)."
      required:
        - "configurationHash"
        - "configurationType"
        - "schema"
    PaymentOrderStatus:
      description: "One flag of a payment order's status. The status is a set, recomputed from the records on every read: New (part of the amount is not yet authorized, annulled, debited or credited), Authorized (reserved, not captured), Annulled (a reservation was released), Debited (captured), Credited (refunded)."
      type: "string"
      enum:
        - "New"
        - "Authorized"
        - "Annulled"
        - "Debited"
        - "Credited"
    PaymentOrderRecord:
      description: "One payment record to add to a payment order: the CommerceOS API shape of a transaction, not the EPI wire shape. CommerceOS rejects a record with a missing required member (400), accepts a repeat of the identical record on the same order as a no-op, refuses a record that reuses a transactionId with any field changed, and answers 400 to a Debit or Authorize beyond the remaining amount."
      type: "object"
      properties:
        identifiers:
          type: "object"
          description: "Your transaction id, qualified by the method."
          properties:
            transactionId:
              type: "object"
              properties:
                method:
                  type: "object"
                  properties:
                    identifiers:
                      type: "object"
                      properties:
                        methodId:
                          type: "string"
                          description: "Your methodId."
                      required:
                        - "methodId"
                      description: "The identifiers of the method."
                  required:
                    - "identifiers"
                  description: "The payment method, by its methodId."
                id:
                  type: "string"
                  description: "Your transactionId, unique within the method."
              required:
                - "method"
                - "id"
              description: "Your transaction id, qualified by the method it belongs to."
          required:
            - "transactionId"
        currency:
          type: "object"
          properties:
            identifiers:
              type: "object"
              properties:
                currencyCode:
                  type: "string"
                  description: "ISO 4217."
              required:
                - "currencyCode"
              description: "The identifiers of the currency."
          required:
            - "identifiers"
          description: "The payment currency."
        timestamp:
          type: "string"
          description: "ISO 8601."
        amount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Finite and non-zero."
        actions:
          type: "array"
          items:
            type: "string"
            enum:
              - "Authorize"
              - "Annul"
              - "Debit"
              - "Credit"
          description: "One or more of the four actions."
        token:
          type: "string"
          description: "The token of the payment. Without it CommerceOS takes the available money for the first action."
        specification:
          type: "array"
          items:
            "$ref": "#/components/schemas/PaymentOrderSpecificationItem"
          description: "The items, in CommerceOS API shape. Leave it out for now: a record that carries specification answers 500 Internal server error today, and the same record without it is accepted (verified 2026-09-28). The payment record then has no item rows in the back office."
        means:
          "$ref": "#/components/schemas/PaymentOrderMeans"
          description: "What paid, in CommerceOS API shape: a singleton is {\"identifiers\":{\"id\":\"Piggy Bank\"}}."
        rawData:
          type: "object"
          description: "Any JSON object."
        consumerPrintout:
          type: "string"
          description: "Receipt text for the customer copy."
        merchantPrintout:
          type: "string"
          description: "Receipt text for the merchant copy."
      required:
        - "identifiers"
        - "currency"
        - "timestamp"
        - "amount"
        - "actions"
    PaymentOrderPatch:
      description: "The body of PATCH /v1/payment-orders/{paymentKey}: the records to add. Use it to complete a payment whose stream dropped before Complete, from a callback of your provider. For a key that never saw a Create or Complete step the answer is 400 with details 'Payment order not found.'."
      type: "object"
      properties:
        records:
          type: "array"
          items:
            "$ref": "#/components/schemas/PaymentOrderRecord"
          description: "The records to add, one per transaction."
      required:
        - "records"
    PaymentOrder:
      description: "The payment order after the patch. Only the members that a payment integration reads are listed."
      type: "object"
      properties:
        identifiers:
          type: "object"
          properties:
            key:
              type: "string"
              description: "The paymentKey."
          description: "The identifiers of the order."
        status:
          type: "array"
          items:
            "$ref": "#/components/schemas/PaymentOrderStatus"
          description: "The status set. A one-step sale is [\"Debited\"], a refunded sale [\"Credited\",\"Debited\"]."
    PaymentOrderMeans:
      description: "A payment means in CommerceOS API shape, told apart by @type. A singleton (a brand) is identified by id, a card by its token; a card also carries scheme, issuer, maskedPan, validFrom and validTo."
      type: "object"
      properties:
        "@type":
          type: "string"
          enum:
            - "singleton payment means"
            - "payment card"
          description: "Which shape. Default: singleton payment means."
        identifiers:
          type: "object"
          properties:
            id:
              type: "string"
              description: "The singleton's id, the same on every transaction of the brand."
            token:
              type: "string"
              description: "The card's token."
          description: "id for a singleton, token for a card."
        scheme:
          type: "string"
          description: "Card: for example Visa."
        issuer:
          type: "string"
          description: "Card: the issuing bank."
        maskedPan:
          type: "string"
          description: "Card: the masked card number."
        validFrom:
          type: "string"
          description: "Card: ISO 8601 date."
        validTo:
          type: "string"
          description: "Card: ISO 8601 date."
      required:
        - "identifiers"
    PaymentOrderSpecificationItem:
      description: "One item of a payment record, in CommerceOS API shape: the article identifier sits under identifiers.specificationIdentifier and the currency under currency.identifiers.currencyCode."
      type: "object"
      properties:
        identifiers:
          type: "object"
          properties:
            specificationIdentifier:
              type: "string"
              description: "The article identifier."
          description: "The item's identifiers."
        description:
          type: "string"
          description: "The article name."
        quantity:
          "$ref": "#/components/schemas/DecimalDto"
          description: "In unit."
        unit:
          type: "string"
          description: "For example pcs."
        totalAmount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "VAT included."
        vatPercentage:
          "$ref": "#/components/schemas/DecimalDto"
          description: "For example 25."
        currency:
          type: "object"
          properties:
            identifiers:
              type: "object"
              properties:
                currencyCode:
                  type: "string"
                  description: "ISO 4217."
              description: "The currency's identifiers."
          description: "The item's currency."
      required:
        - "quantity"
        - "totalAmount"
        - "vatPercentage"
    CosErrorBody:
      description: "The body of a non-2xx answer from CommerceOS: a type discriminator, a generic message, and the specific reason in details."
      type: "object"
      properties:
        "@type":
          type: "string"
          description: "For example bad request, not found, unauthorized."
        message:
          type: "string"
          description: "Generic, for example 'The request was invalid and could not be processed.'"
        details:
          type: "string"
          description: "The specific reason, for example 'Payment order not found.' or 'Amount must agree with designated instance.'"
        info:
          description: "Optional extra data."
      required:
        - "@type"
        - "message"
