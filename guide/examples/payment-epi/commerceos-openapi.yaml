      tags:
        - "Token"
      summary: "A client-credentials token"
      description: "Before the first call and after expires_in seconds. Send the form with grant_type client_credentials and the client from the install payload."
      servers:
        - url: "{tokenUrl}"
          variables:
            tokenUrl:
              default: "https://example.app.heads.com/oauth2/v1/token"
              description: "tokenUrl from the install payload, complete. The path below is already part of it"
      requestBody:
        required: true
        content:
          "application/x-www-form-urlencoded":
            schema:
              "$ref": "#/components/schemas/TokenRequest"
      security: []
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TokenResponse"
