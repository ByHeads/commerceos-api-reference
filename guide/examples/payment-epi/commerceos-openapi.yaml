            - "kv"
      responses:
        "200":
          description: "The stored JSON value."
          content:
            "application/json":
              schema: {}
        "4XX":
          description: "A failed call: a non-2xx status with an error body."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorBody"
    put:
      tags:
        - "Key-value store"
      summary: "Write a value"
      description: "Any JSON value. The answer echoes it."
      parameters:
        - name: "container"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "key"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {}
      security:
