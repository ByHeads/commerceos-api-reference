  "/v1/kv/{container}/{key}":
    get:
      tags:
        - "Key-value store"
      summary: "Read a value"
      description: "Your own state, for example a provider session behind a paymentKey, so that a restart of your integration loses nothing. container is a namespaced key such as com.example.payments."
      parameters:
