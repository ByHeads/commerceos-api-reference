                "$ref": "#/components/schemas/ContextConfig"
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
  "/v1/kv/{container}/{key}":
    get:
      tags:
        - "Key-value store"
      summary: "Read a value"
      description: "Your own state, for example a provider session behind a paymentKey, so that a restart of your integration loses nothing. container is a namespaced key such as com.example.payments. A missing entry answers 200 with null, not 404. A sub-path of a stored document is addressable on its own: /v1/kv/{container}/{key}/state."
      parameters:
        - name: "container"
          in: "path"
          required: true
