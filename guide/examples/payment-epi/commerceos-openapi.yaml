          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PaymentOrder"
        "4XX":
          description: "A failed call: a non-2xx status with a CommerceOS error body; the reason is in details."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CosErrorBody"
components:
  securitySchemes:
    oauth2:
      type: "oauth2"
      description: "Client credentials of the OAuth2 client from the install payload. Request the token at the tokenUrl of the install payload; the URL below is the example instance."
      flows:
        clientCredentials:
          tokenUrl: "https://example.app.heads.com/oauth2/v1/token"
          scopes:
            me: "Read the configuration behind a context id (and the integration's own user)."
            kv: "Read, write and delete values in the key-value store."
            "orders.payments:write": "Add payment records to a payment order."
            "geo:read": "In the default client. Not needed by these routes."
            "orders.sales:write": "In the default client. Not needed by these routes."
            "payment-records:write": "In the default client. Not needed by these routes."
  schemas:
    DecimalDto:
      type: "string"
      pattern: "^(-?\\d+(\\.\\d+)?|Missing)$"
      description: "A decimal number as a string, never a JSON number. CommerceOS sends a whole amount without decimals (\"15\", not \"15.00\") and a fraction as typed (\"10.04\"); accept both and compare numerically. In a specification item CommerceOS may send the literal \"Missing\" for a quantity or amount it does not know; do not parse it as a number. Answer in either numeric form."
    TokenRequest:
      description: "The form body of POST {tokenUrl}, application/x-www-form-urlencoded."
      type: "object"
      properties:
        grant_type:
          description: "Always client_credentials."
          const: "client_credentials"
        client_id:
          type: "string"
          description: "clientId from the install payload."
        client_secret:
          type: "string"
          description: "clientSecret from the install payload."
        scope:
          type: "string"
          description: "scope from the install payload, or the subset you need, space-separated. Always send it: a token requested without scope is valid and carries no scopes, so every later call fails."
      required:
        - "grant_type"
        - "client_id"
        - "client_secret"
    TokenResponse:
      description: "A bearer token. Cache it until expires_in seconds have passed, then request a new one."
      type: "object"
      properties:
        access_token:
          type: "string"
          description: "Send it as Authorization: Bearer <access_token>."
        token_type:
          type: "string"
          description: "Bearer."
        expires_in:
          type: "integer"
          description: "Lifetime in seconds, 3600 today. Read it rather than assuming it."
        scope:
          type: "string"
          description: "The granted scopes, space-separated."
      required:
        - "access_token"
        - "expires_in"
    ContextConfig:
      description: "The configuration behind a context id, as an administrator saved it against your config schema. The element also carries node (the organization node) and a configure action."
      type: "object"
      properties:
        configuration:
          type: "object"
          additionalProperties: true
          description: "The values, keyed as your config schema's members. Absent when the administrator has saved nothing yet."
        configurationHash:
          type: "string"
          description: "Equals the X-EPI-Context-Config-Hash header of the calls that run under this configuration. Cache by it."
        node:
          type: "object"
          additionalProperties: true
          description: "The organization node that holds the configuration."
      required:
        - "configurationHash"
    PaymentOrderStatus:
      description: "One flag of a payment order's status. The status is a set, recomputed from the records on every read: New (part of the amount is not yet authorized, annulled, debited or credited), Authorized (reserved, not captured), Annulled (a reservation was released), Debited (captured), Credited (refunded)."
      type: "string"
      enum:
        - "New"
        - "Authorized"
        - "Annulled"
        - "Debited"
        - "Credited"
    PaymentOrderRecord:
      description: "One payment record to add to a payment order: the CommerceOS API shape of a transaction, not the EPI wire shape. CommerceOS rejects a record with a missing required member (400), accepts a repeat of the identical record on the same order as a no-op, refuses a record that reuses a transactionId with any field changed, and answers 400 to a Debit or Authorize beyond the remaining amount."
      type: "object"
      properties:
        identifiers:
          type: "object"
          description: "Your transaction id, qualified by the method."
          properties:
            transactionId:
              type: "object"
              properties:
                method:
                  type: "object"
                  properties:
                    identifiers:
                      type: "object"
                      properties:
                        methodId:
                          type: "string"
                          description: "Your methodId."
                      required:
                        - "methodId"
                      description: "The identifiers of the method."
                  required:
                    - "identifiers"
                  description: "The payment method, by its methodId."
                id:
                  type: "string"
                  description: "Your transactionId, unique within the method."
              required:
                - "method"
                - "id"
              description: "Your transaction id, qualified by the method it belongs to."
          required:
            - "transactionId"
        currency:
          type: "object"
          properties:
            identifiers:
              type: "object"
              properties:
                currencyCode:
                  type: "string"
                  description: "ISO 4217."
              required:
                - "currencyCode"
              description: "The identifiers of the currency."
          required:
            - "identifiers"
          description: "The payment currency."
        timestamp:
          type: "string"
          description: "ISO 8601."
        amount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "Finite and non-zero."
        actions:
          type: "array"
          items:
            type: "string"
            enum:
              - "Authorize"
              - "Annul"
              - "Debit"
              - "Credit"
          description: "One or more of the four actions."
        token:
          type: "string"
          description: "The token of the payment. Without it CommerceOS takes the available money for the first action."
        specification:
          type: "array"
          items:
            "$ref": "#/components/schemas/PaymentOrderSpecificationItem"
          description: "The items, in CommerceOS API shape."
        means:
          "$ref": "#/components/schemas/PaymentOrderMeans"
          description: "What paid, in CommerceOS API shape: a singleton is {\"identifiers\":{\"id\":\"Piggy Bank\"}}."
        rawData:
          type: "object"
          description: "Any JSON object."
        consumerPrintout:
          type: "string"
          description: "Receipt text for the customer copy."
        merchantPrintout:
          type: "string"
          description: "Receipt text for the merchant copy."
      required:
        - "identifiers"
        - "currency"
        - "timestamp"
        - "amount"
        - "actions"
    PaymentOrderPatch:
      description: "The body of PATCH /v1/payment-orders/{paymentKey}: the records to add. Use it to complete a payment whose stream dropped before Complete, from a callback of your provider. For a key that never saw a Create or Complete step the answer is 400 with details 'Payment order not found.'."
      type: "object"
      properties:
        records:
          type: "array"
          items:
            "$ref": "#/components/schemas/PaymentOrderRecord"
          description: "The records to add, one per transaction."
      required:
        - "records"
    PaymentOrder:
      description: "The payment order after the patch. Only the members that a payment integration reads are listed."
      type: "object"
      properties:
        identifiers:
          type: "object"
          properties:
            key:
              type: "string"
              description: "The paymentKey."
          description: "The identifiers of the order."
        status:
          type: "array"
          items:
            "$ref": "#/components/schemas/PaymentOrderStatus"
          description: "The status set. A one-step sale is [\"Debited\"], a refunded sale [\"Credited\",\"Debited\"]."
    PaymentOrderMeans:
      description: "A payment means in CommerceOS API shape, told apart by @type. A singleton (a brand) is identified by id, a card by its token; a card also carries scheme, issuer, maskedPan, validFrom and validTo."
      type: "object"
      properties:
        "@type":
          type: "string"
          enum:
            - "singleton payment means"
            - "payment card"
          description: "Which shape. Default: singleton payment means."
        identifiers:
          type: "object"
          properties:
            id:
              type: "string"
              description: "The singleton's id, the same on every transaction of the brand."
            token:
              type: "string"
              description: "The card's token."
          description: "id for a singleton, token for a card."
        scheme:
          type: "string"
          description: "Card: for example Visa."
        issuer:
          type: "string"
          description: "Card: the issuing bank."
        maskedPan:
          type: "string"
          description: "Card: the masked card number."
        validFrom:
          type: "string"
          description: "Card: ISO 8601 date."
        validTo:
          type: "string"
          description: "Card: ISO 8601 date."
      required:
        - "identifiers"
    PaymentOrderSpecificationItem:
      description: "One item of a payment record, in CommerceOS API shape: the article identifier sits under identifiers.specificationIdentifier and the currency under currency.identifiers.currencyCode."
      type: "object"
      properties:
        identifiers:
          type: "object"
          properties:
            specificationIdentifier:
              type: "string"
              description: "The article identifier."
          description: "The item's identifiers."
        description:
          type: "string"
          description: "The article name."
        quantity:
          "$ref": "#/components/schemas/DecimalDto"
          description: "In unit."
        unit:
          type: "string"
          description: "For example pcs."
        totalAmount:
          "$ref": "#/components/schemas/DecimalDto"
          description: "VAT included."
        vatPercentage:
          "$ref": "#/components/schemas/DecimalDto"
          description: "For example 25."
        currency:
          type: "object"
          properties:
            identifiers:
              type: "object"
              properties:
                currencyCode:
                  type: "string"
                  description: "ISO 4217."
              description: "The currency's identifiers."
          description: "The item's currency."
      required:
        - "quantity"
        - "totalAmount"
        - "vatPercentage"
    CosErrorBody:
      description: "The body of a non-2xx answer from CommerceOS: a type discriminator, a generic message, and the specific reason in details."
      type: "object"
      properties:
        "@type":
          type: "string"
          description: "For example bad request, not found, unauthorized."
        message:
          type: "string"
          description: "Generic, for example 'The request was invalid and could not be processed.'"
        details:
          type: "string"
          description: "The specific reason, for example 'Payment order not found.' or 'Amount must agree with designated instance.'"
        info:
          description: "Optional extra data."
      required:
        - "@type"
        - "message"
